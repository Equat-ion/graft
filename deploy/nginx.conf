events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Increase timeouts for long-running agent inference calls
    proxy_read_timeout    300s;
    proxy_connect_timeout  10s;
    proxy_send_timeout    300s;

    # Allow larger payloads for webhook and file upload routes
    client_max_body_size 10m;

    server {
        listen 7860;

        # FastAPI — strip the /backend prefix before forwarding
        # Browser calls: https://space.hf.space/backend/api/projects
        # FastAPI receives: /api/projects
        location /backend/ {
            proxy_pass         http://localhost:8000/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Next.js — everything else (including /api/auth, /api/github, etc.)
        location / {
            proxy_pass         http://localhost:3000;
            proxy_http_version 1.1;
            # Required for Next.js HMR websocket (dev) and streaming RSC
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
