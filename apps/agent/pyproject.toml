[project]
name = "graft-agent"
version = "0.1.0"
description = "Graft autonomous dependency-upgrade agent (FastAPI + LangGraph)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.12",
    # DB
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # Watcher / scheduler
    "apscheduler>=3.10.4",
    "feedparser>=6.0.11",
    "httpx>=0.27.0",
    "packaging>=24.1",
    # Agent / LLM
    "langgraph>=0.2.50",
    "langchain-core>=0.3.20",
    "langchain-openai>=0.2.10",
    "openai>=1.55.0",
    # Code analysis
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    # Sandbox
    "docker>=7.1.0",
    # Inference (optional at runtime; required when serving the agent)
    # vLLM is heavy and platform-specific, install via extras:
    #   pip install -e .[inference]
]

[project.optional-dependencies]
inference = [
    "vllm>=0.6.4",
    "torch>=2.5.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
